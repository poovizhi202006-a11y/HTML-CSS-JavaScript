<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>numberguessing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>guess number (0 to 10)</h1>
    </header>
    <div id="outbox">
        <div>
            <h2>you guess</h2>
            <h3 id="ug">0</h3>
        </div>
        <div>
            <h2>AI guess</h2>
            <h3 id="aig">0</h3>
        </div>
    </div>
    <div id="text">
        <input type="number" id="num" ><br><br>
    </div>
    <div id="button">
        <button id="but">submit</button>
        <button id="re">restart</button>
    </div>
    <h1 id="res"></h1>

    <script src="index.js"></script>
</body>
</html>
